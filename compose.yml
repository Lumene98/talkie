services:
  transcription:
    build: ./asr
    init: true
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      OLLAMA_MODEL: frozenlab/qwen3-asr:0.6b
      OLLAMA_BASE_URL: http://127.0.0.1:11434
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 3

  backend:
    build: ./backend
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BIND_ADDR: 0.0.0.0:8000
      ASR_URL: http://transcription:8001/transcribe
      ASR_TIMEOUT_SECS: "130"
    depends_on:
      transcription:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  ollama_models:
    # Reuse the model cache from the previous asr/compose.yml.
    name: asr_ollama_models
